<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">LEGS</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#10b9811a" stroke="#10b98166" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#10b981" />
  <text x="175" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">QUADS & GLUTES</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Deep Squat Athlete -->
      <circle cx="200" cy="85" r="11" fill="#94a3b8" />
      <!-- Upright Torso -->
      <line x1="200" y1="98" x2="198" y2="135" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" />

      <!-- Dumbbell cupped at chest -->
      <rect x="202" y="102" width="10" height="18" rx="3" fill="#64748b" />
      <circle cx="207" cy="102" r="7" fill="#06b6d4" />
      <circle cx="207" cy="120" r="7" fill="#06b6d4" />
      <!-- Cupping arms -->
      <path d="M 195 104 L 204 116 L 210 108" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

      <!-- Parallel Thighs & Deep Knees -->
      <!-- Left leg -->
      <path d="M 194 135 L 160 135 L 165 185" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right leg -->
      <path d="M 204 135 L 238 135 L 233 185" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Quads & Glutes Glowing -->
      <line x1="190" y1="135" x2="165" y2="135" stroke="#10b981" stroke-width="7" filter="url(#glow)" />
      <line x1="208" y1="135" x2="233" y2="135" stroke="#10b981" stroke-width="7" filter="url(#glow)" />
      <circle cx="198" cy="138" r="8" fill="#10b981" filter="url(#glow)" />

      <!-- Vertical posture line (perfect form) -->
      <line x1="200" y1="70" x2="200" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="3" />
      <text x="220" y="75" fill="#22c55e" font-size="9" font-weight="bold">✓ 90° UPRIGHT</text>
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Glue DB to chest, sit between knees, upright posture</text>
</svg>