<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">BACK</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#06b6d41a" stroke="#06b6d466" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#06b6d4" />
  <text x="175" y="31" fill="#06b6d4" font-size="10" font-weight="700" text-anchor="middle">UNILATERAL LATS</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Flat bench -->
      <rect x="90" y="145" width="140" height="12" rx="4" fill="#334155" />
      <rect x="100" y="157" width="10" height="28" fill="#1e293b" />
      <rect x="210" y="157" width="10" height="28" fill="#1e293b" />

      <!-- Athlete supporting on bench -->
      <circle cx="130" cy="100" r="10" fill="#94a3b8" />
      <!-- Arm on bench -->
      <line x1="140" y1="110" x2="120" y2="145" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
      <!-- Tabletop Flat Spine -->
      <line x1="140" y1="110" x2="215" y2="115" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />
      <!-- Lat Muscle Glow -->
      <line x1="165" y1="110" x2="200" y2="115" stroke="#06b6d4" stroke-width="7" filter="url(#glow)" />
      <!-- Knee on bench -->
      <path d="M 215 115 L 215 145 L 190 145" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Standing leg on floor -->
      <line x1="215" y1="115" x2="245" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Rowing arm pulling dumbbell to hip -->
      <path d="M 160 110 L 175 90 L 185 115" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="180" y="115" width="6" height="16" rx="2" fill="#64748b" />
      <circle cx="183" cy="115" r="6" fill="#06b6d4" />
      <circle cx="183" cy="131" r="6" fill="#06b6d4" />

      <!-- J-Curve Motion Arrow -->
      <path d="M 175 145 Q 165 125 180 108" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2" />
      <polygon points="183,105 174,107 178,114" fill="#06b6d4" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Flat tabletop back, pull DB in J-curve to hip</text>
</svg>