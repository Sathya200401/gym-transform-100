<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ARMS</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#f59e0b1a" stroke="#f59e0b66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#f59e0b" />
  <text x="175" y="31" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">BRACHIALIS & FOREARMS</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Standing athlete -->
      <circle cx="200" cy="70" r="11" fill="#94a3b8" />
      <rect x="190" y="83" width="20" height="52" rx="6" fill="#cbd5e1" />
      <line x1="195" y1="135" x2="190" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="205" y1="135" x2="210" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Forearms & Neutral Grip Dumbbells -->
      <path d="M 188 90 L 175 115 L 165 95" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <!-- Vertical Dumbbell -->
      <rect x="162" y="86" width="6" height="18" rx="2" fill="#64748b" />
      <circle cx="165" cy="86" r="6" fill="#06b6d4" />
      <circle cx="165" cy="104" r="6" fill="#06b6d4" />

      <path d="M 212 90 L 225 115 L 235 95" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <rect x="232" y="86" width="6" height="18" rx="2" fill="#64748b" />
      <circle cx="235" cy="86" r="6" fill="#06b6d4" />
      <circle cx="235" cy="104" r="6" fill="#06b6d4" />

      <!-- Brachialis Glow -->
      <circle cx="174" cy="108" r="6" fill="#f59e0b" filter="url(#glow)" />
      <circle cx="226" cy="108" r="6" fill="#f59e0b" filter="url(#glow)" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Neutral grip (palms face each other), build arm thickness</text>
</svg>