<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CHEST</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#f43f5e1a" stroke="#f43f5e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#f43f5e" />
  <text x="175" y="31" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">INNER CHEST SQUEEZE</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Cable Towers left and right -->
      <line x1="60" y1="40" x2="60" y2="185" stroke="#334155" stroke-width="6" />
      <circle cx="60" cy="90" r="6" fill="#06b6d4" />
      <line x1="340" y1="40" x2="340" y2="185" stroke="#334155" stroke-width="6" />
      <circle cx="340" cy="90" r="6" fill="#06b6d4" />

      <!-- Standing Athlete center (front-quarter) -->
      <circle cx="200" cy="80" r="12" fill="#94a3b8" />
      <rect x="188" y="94" width="24" height="42" rx="8" fill="#cbd5e1" />
      <!-- Chest Glow -->
      <ellipse cx="200" cy="105" rx="14" ry="8" fill="#f43f5e" filter="url(#glow)" />
      <!-- Legs staggered -->
      <line x1="194" y1="136" x2="182" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="206" y1="136" x2="220" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Cable Lines -->
      <line x1="60" y1="90" x2="150" y2="108" stroke="#64748b" stroke-width="2" stroke-dasharray="3" />
      <line x1="340" y1="90" x2="250" y2="108" stroke="#64748b" stroke-width="2" stroke-dasharray="3" />

      <!-- Hugging Arms meeting in front -->
      <path d="M 188 100 Q 140 100 175 120" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <path d="M 212 100 Q 260 100 225 120" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <!-- Handles -->
      <circle cx="178" cy="120" r="5" fill="#f43f5e" />
      <circle cx="222" cy="120" r="5" fill="#f43f5e" />
      <!-- Hug Arrows -->
      <path d="M 150 115 Q 170 128 185 125" fill="none" stroke="#f43f5e" stroke-width="2" />
      <path d="M 250 115 Q 230 128 215 125" fill="none" stroke="#f43f5e" stroke-width="2" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Hug a wide tree, bring inner biceps together</text>
</svg>