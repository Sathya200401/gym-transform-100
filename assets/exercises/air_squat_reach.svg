<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">LEGS / POSTURE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#10b9811a" stroke="#10b98166" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#10b981" />
  <text x="175" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">LEGS & THORACIC SPINE OPENING</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Athlete standing tall with arms reaching high overhead -->
      <circle cx="200" cy="55" r="10" fill="#94a3b8" />
      <!-- Torso tall -->
      <line x1="200" y1="68" x2="200" y2="130" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Arms reaching high overhead in V -->
      <line x1="195" y1="72" x2="175" y2="35" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <line x1="205" y1="72" x2="225" y2="35" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Legs standing strong -->
      <line x1="195" y1="130" x2="185" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="205" y1="130" x2="215" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Full Anterior Chain Glow -->
      <line x1="200" y1="70" x2="200" y2="120" stroke="#10b981" stroke-width="6" filter="url(#glow)" />
      <circle cx="175" cy="35" r="5" fill="#06b6d4" />
      <circle cx="225" cy="35" r="5" fill="#06b6d4" />

      <!-- Reach Tall Arrows -->
      <polygon points="175,25 170,33 180,33" fill="#06b6d4" />
      <polygon points="225,25 220,33 230,33" fill="#06b6d4" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Deep squat, explode up reaching tall to ceiling</text>
</svg>