<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CORE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#22c55e1a" stroke="#22c55e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#22c55e" />
  <text x="175" y="31" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">FULL CORE CORSET</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Exercise Mat -->
      <rect x="70" y="165" width="260" height="8" rx="3" fill="#1e293b" />

      <!-- Athlete in perfect rigid plank line -->
      <!-- Head -->
      <circle cx="115" cy="120" r="10" fill="#94a3b8" />
      <!-- Forearms on mat -->
      <line x1="130" y1="132" x2="130" y2="162" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
      <line x1="130" y1="162" x2="110" y2="162" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

      <!-- Straight Body Plank Line -->
      <line x1="130" y1="132" x2="275" y2="152" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" />

      <!-- CORE & GLUTES GLOWING -->
      <line x1="155" y1="136" x2="215" y2="144" stroke="#22c55e" stroke-width="7" filter="url(#glow)" />
      <circle cx="230" cy="146" r="8" fill="#10b981" filter="url(#glow)" />

      <!-- Toes on floor -->
      <line x1="275" y1="152" x2="282" y2="162" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

      <!-- Opposing Isometric arrows (Elbows to toes) -->
      <line x1="135" y1="170" x2="165" y2="170" stroke="#22c55e" stroke-width="2" />
      <polygon points="170,170 162,166 162,174" fill="#22c55e" />
      <line x1="275" y1="170" x2="245" y2="170" stroke="#22c55e" stroke-width="2" />
      <polygon points="240,170 248,166 248,174" fill="#22c55e" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Pull elbows toward toes, glutes rock-hard, flat board</text>
</svg>