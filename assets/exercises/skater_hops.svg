<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">AGILITY / ROOM</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#ec48991a" stroke="#ec489966" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#ec4899" />
  <text x="175" y="31" fill="#ec4899" font-size="10" font-weight="700" text-anchor="middle">GLUTE MEDIUS & FOOT SPEED</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Agility Athlete in mid-bound -->
      <circle cx="210" cy="75" r="11" fill="#94a3b8" />
      <!-- Athletic Forward Torso -->
      <line x1="206" y1="88" x2="190" y2="135" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Glute Medius Glow -->
      <circle cx="190" cy="135" r="9" fill="#ec4899" filter="url(#glow)" />

      <!-- Left leg loaded on floor -->
      <path d="M 190 135 L 180 155 L 180 185" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right leg sweeping behind -->
      <path d="M 190 135 L 235 160 L 245 175" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

      <!-- Running Arms -->
      <path d="M 205 92 L 235 110 L 230 130" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <path d="M 195 92 L 165 115" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Dynamic Lateral Motion Arrows -->
      <path d="M 140 160 Q 185 140 230 160" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="3" />
      <polygon points="135,160 143,155 143,165" fill="#ec4899" />
      <polygon points="235,160 227,155 227,165" fill="#ec4899" />
      <text x="185" y="130" fill="#ec4899" font-size="9" font-weight="bold" text-anchor="middle">⚡ LATERAL BOUND</text>
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Bound side to side, absorb impact softly, build springiness</text>
</svg>