<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">AGILITY / ROOM</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#ec48991a" stroke="#ec489966" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#ec4899" />
  <text x="175" y="31" fill="#ec4899" font-size="10" font-weight="700" text-anchor="middle">CALVES, ANKLE STIFFNESS & FOOT SPEED</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Agility Ladder on Floor -->
      <line x1="80" y1="185" x2="320" y2="185" stroke="#334155" stroke-width="3" />
      <line x1="80" y1="175" x2="320" y2="175" stroke="#334155" stroke-width="3" />
      <line x1="120" y1="175" x2="120" y2="185" stroke="#475569" stroke-width="2" />
      <line x1="160" y1="175" x2="160" y2="185" stroke="#475569" stroke-width="2" />
      <line x1="200" y1="175" x2="200" y2="185" stroke="#475569" stroke-width="2" />
      <line x1="240" y1="175" x2="240" y2="185" stroke="#475569" stroke-width="2" />
      <line x1="280" y1="175" x2="280" y2="185" stroke="#475569" stroke-width="2" />

      <!-- Athletic Stance Sprinter -->
      <circle cx="200" cy="70" r="11" fill="#94a3b8" />
      <line x1="200" y1="82" x2="198" y2="130" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Pumping Arms -->
      <path d="M 195 90 L 175 110 L 165 95" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <path d="M 205 90 L 225 110 L 235 125" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Rapid Feet pattern -->
      <line x1="196" y1="130" x2="188" y2="175" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="204" y1="130" x2="215" y2="170" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Calves and feet glow -->
      <circle cx="188" cy="170" r="6" fill="#ec4899" filter="url(#glow)" />
      <circle cx="215" cy="165" r="6" fill="#ec4899" filter="url(#glow)" />

      <!-- Rapid motion ripples -->
      <path d="M 175 180 Q 188 165 200 180" fill="none" stroke="#ec4899" stroke-width="2" />
      <path d="M 205 180 Q 218 165 230 180" fill="none" stroke="#ec4899" stroke-width="2" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Stay on balls of feet, hot coals cadence, reactive speed</text>
</svg>