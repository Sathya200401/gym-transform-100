<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">LEGS</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#10b9811a" stroke="#10b98166" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#10b981" />
  <text x="175" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">QUADS & GLUTES</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Leg Press Machine Sled at 45 deg -->
      <line x1="100" y1="60" x2="220" y2="170" stroke="#334155" stroke-width="10" stroke-linecap="round" />
      <!-- Footplate -->
      <line x1="90" y1="75" x2="125" y2="45" stroke="#475569" stroke-width="8" stroke-linecap="round" />

      <!-- Reclined Seat -->
      <line x1="200" y1="185" x2="260" y2="140" stroke="#334155" stroke-width="12" stroke-linecap="round" />

      <!-- Athlete in seat -->
      <circle cx="260" cy="128" r="10" fill="#94a3b8" />
      <line x1="250" y1="138" x2="210" y2="172" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Legs bent pushing plate -->
      <path d="M 210 172 L 155 130 L 112 65" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Quad Glow -->
      <line x1="205" y1="168" x2="160" y2="132" stroke="#10b981" stroke-width="7" filter="url(#glow)" />

      <!-- Push Vector -->
      <path d="M 130 90 L 115 75" stroke="#10b981" stroke-width="3" />
      <polygon points="110,70 115,79 122,72" fill="#10b981" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Tailbone glued to pad, don't lock knees at top</text>
</svg>