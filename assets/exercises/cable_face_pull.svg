<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">BACK / POSTURE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#a855f71a" stroke="#a855f766" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#a855f7" />
  <text x="175" y="31" fill="#a855f7" font-size="10" font-weight="700" text-anchor="middle">REAR DELTS & UPPER BACK</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Cable pulley at eye level -->
      <line x1="80" y1="40" x2="80" y2="185" stroke="#334155" stroke-width="6" />
      <circle cx="80" cy="85" r="7" fill="#06b6d4" />

      <!-- Standing Athlete -->
      <circle cx="230" cy="75" r="11" fill="#94a3b8" />
      <line x1="225" y1="88" x2="215" y2="140" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />
      <!-- Rear delt glow -->
      <circle cx="220" cy="92" r="8" fill="#a855f7" filter="url(#glow)" />
      <!-- Upper back glow -->
      <line x1="216" y1="92" x2="212" y2="115" stroke="#06b6d4" stroke-width="6" filter="url(#glow)" />
      <!-- Staggered stance -->
      <line x1="215" y1="140" x2="195" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="215" y1="140" x2="235" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Cable Rope to face -->
      <line x1="80" y1="85" x2="185" y2="80" stroke="#64748b" stroke-width="3" />
      <!-- Rope split -->
      <path d="M 185 80 L 210 70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
      <path d="M 185 80 L 210 90" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
      <!-- High Flared Elbows -->
      <path d="M 215 90 L 235 85 L 210 70" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- External Rotation Cue Icon -->
      <path d="M 225 65 A 15 15 0 0 1 245 78" fill="none" stroke="#10b981" stroke-width="2" />
      <polygon points="247,82 242,75 250,75" fill="#10b981" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Pull to bridge of nose, flare rope wide, cure hunchback</text>
</svg>