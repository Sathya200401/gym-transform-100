      <!-- LOWER ABS GLOWING -->
      <circle cx="202" cy="115" r="9" fill="#22c55e" filter="url(#glow)" />

      <!-- Pelvic Curl Arrow -->
      <path d="M 220 130 A 20 20 0 0 0 220 95" fill="none" stroke="#22c55e" stroke-width="3" />
      <polygon points="215,95 223,90 223,100" fill="#22c55e" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
