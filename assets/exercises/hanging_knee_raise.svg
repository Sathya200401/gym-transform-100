  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CORE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#22c55e1a" stroke="#22c55e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#22c55e" />
  <text x="175" y="31" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">LOWER ABDOMINALS</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Pullup Bar Overhead -->
      <line x1="150" y1="35" x2="250" y2="35" stroke="#475569" stroke-width="8" stroke-linecap="round" />

      <!-- Hanging Athlete -->
      <!-- Hands on bar -->
      <circle cx="185" cy="35" r="5" fill="#64748b" />
      <circle cx="215" cy="35" r="5" fill="#64748b" />
      <!-- Arms straight down -->
      <line x1="185" y1="35" x2="192" y2="65" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <line x1="215" y1="35" x2="208" y2="65" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Head & Torso -->
