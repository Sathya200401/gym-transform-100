<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">LEGS / POSTURE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#10b9811a" stroke="#10b98166" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#10b981" />
  <text x="175" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">HAMSTRINGS & GLUTES (PELVIC TILT FIX)</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Hip Hinge Athlete -->
      <circle cx="140" cy="115" r="10" fill="#94a3b8" />
      <!-- Flat Back at 45 deg angle -->
      <line x1="148" y1="120" x2="215" y2="115" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Pelvis & Glutes pushed back -->
      <circle cx="218" cy="115" r="10" fill="#10b981" filter="url(#glow)" />
      <!-- Soft Knee bend with vertical shins -->
      <path d="M 218 115 L 210 148 L 215 185" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Hamstrings glowing under stretch! -->
      <line x1="216" y1="118" x2="210" y2="148" stroke="#10b981" stroke-width="6" filter="url(#glow)" />

      <!-- Arms hanging straight down with dumbbells under shins -->
      <line x1="160" y1="122" x2="160" y2="162" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <rect x="150" y="160" width="20" height="5" rx="2" fill="#64748b" />
      <circle cx="150" cy="162" r="6" fill="#06b6d4" />
      <circle cx="170" cy="162" r="6" fill="#06b6d4" />

      <!-- Hip Drive Arrow -->
      <path d="M 218 115 L 245 115" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <polygon points="250,115 242,110 242,120" fill="#10b981" />
      <text x="220" y="105" fill="#10b981" font-size="9" font-weight="bold">HIP HINGE</text>
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Push hips back to wall, slight knee bend, flat back</text>
</svg>