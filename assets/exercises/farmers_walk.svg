<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">FULL BODY / CORE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#06b6d41a" stroke="#06b6d466" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#06b6d4" />
  <text x="175" y="31" fill="#06b6d4" font-size="10" font-weight="700" text-anchor="middle">GRIP, TRAPS & CORE CARRIAGE</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Upright Striding Athlete -->
      <circle cx="200" cy="65" r="11" fill="#94a3b8" />
      <line x1="200" y1="78" x2="200" y2="135" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" />

      <!-- Traps & Core Glow -->
      <line x1="192" y1="80" x2="208" y2="80" stroke="#06b6d4" stroke-width="7" filter="url(#glow)" />
      <line x1="197" y1="105" x2="197" y2="130" stroke="#22c55e" stroke-width="6" filter="url(#glow)" />

      <!-- Striding legs heel-to-toe -->
      <line x1="200" y1="135" x2="180" y2="185" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
      <line x1="200" y1="135" x2="225" y2="185" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />

      <!-- Heavy Dumbbells in each hand -->
      <line x1="190" y1="85" x2="180" y2="135" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <rect x="175" y="132" width="10" height="24" rx="3" fill="#64748b" />
      <circle cx="180" cy="132" r="7" fill="#06b6d4" />
      <circle cx="180" cy="156" r="7" fill="#06b6d4" />

      <line x1="210" y1="85" x2="220" y2="135" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <rect x="215" y="132" width="10" height="24" rx="3" fill="#64748b" />
      <circle cx="220" cy="132" r="7" fill="#06b6d4" />
      <circle cx="220" cy="156" r="7" fill="#06b6d4" />

      <!-- Forward Stride Arrow -->
      <path d="M 235 150 L 265 150" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
      <polygon points="270,150 262,145 262,155" fill="#06b6d4" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Walk tall like a king, shoulders pinned, tight anti-sway core</text>
</svg>