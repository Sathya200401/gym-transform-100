<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CHEST</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#f43f5e1a" stroke="#f43f5e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#f43f5e" />
  <text x="175" y="31" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">UPPER CHEST</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Incline Bench 30 deg -->
      <line x1="120" y1="175" x2="210" y2="115" stroke="#334155" stroke-width="14" stroke-linecap="round" />
      <rect x="195" y="172" width="12" height="13" fill="#1e293b" />
      <line x1="120" y1="175" x2="160" y2="185" stroke="#334155" stroke-width="12" stroke-linecap="round" />

      <!-- Athlete reclined -->
      <circle cx="202" cy="100" r="11" fill="#94a3b8" />
      <line x1="192" y1="112" x2="140" y2="160" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" />
      <!-- Upper chest glow -->
      <circle cx="180" cy="120" r="10" fill="#f43f5e" filter="url(#glow)" />
      <path d="M 140 160 L 165 170 L 175 185" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />

      <!-- Arms & Dumbbells pressing upward -->
      <path d="M 180 120 L 160 88" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <circle cx="155" cy="85" r="7" fill="#06b6d4" />
      <circle cx="170" cy="80" r="7" fill="#06b6d4" />

      <path d="M 185 125 L 210 82" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      <circle cx="205" cy="78" r="7" fill="#06b6d4" />
      <circle cx="220" cy="74" r="7" fill="#06b6d4" />

      <!-- 30° Arc Indicator -->
      <path d="M 145 175 A 30 30 0 0 1 170 160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2" />
      <text x="160" y="155" fill="#f59e0b" font-size="9" font-weight="bold">30°</text>
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Bench at 30°, press upward with upper clavicle</text>
</svg>