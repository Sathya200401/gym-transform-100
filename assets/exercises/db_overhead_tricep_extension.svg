<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ARMS</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#f59e0b1a" stroke="#f59e0b66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#f59e0b" />
  <text x="175" y="31" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">TRICEP LONG HEAD</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Seated athlete -->
      <circle cx="190" cy="90" r="11" fill="#94a3b8" />
      <rect x="182" y="103" width="16" height="42" rx="4" fill="#cbd5e1" />
      <path d="M 188 145 L 215 145 L 220 185" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Tricep Long Head Glow -->
      <line x1="176" y1="75" x2="176" y2="92" stroke="#f59e0b" stroke-width="6" filter="url(#glow)" />

      <!-- Arms bent overhead behind skull -->
      <path d="M 186 103 L 180 72 L 165 88" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Dumbbell held vertically -->
      <rect x="156" y="86" width="18" height="6" rx="2" fill="#64748b" />
      <circle cx="156" cy="89" r="6" fill="#06b6d4" />
      <circle cx="174" cy="89" r="6" fill="#06b6d4" />

      <!-- Extension Arrow Upward -->
      <path d="M 160 80 Q 165 60 178 52" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2" />
      <polygon points="182,50 173,53 178,60" fill="#f59e0b" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Elbows point forward, deep stretch behind head</text>
</svg>