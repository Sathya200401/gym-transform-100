<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CORE</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#22c55e1a" stroke="#22c55e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#22c55e" />
  <text x="175" y="31" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">TRANSVERSE ABDOMINIS (FLAT STOMACH)</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Exercise Mat -->
      <rect x="70" y="160" width="260" height="8" rx="3" fill="#1e293b" />

      <!-- Athlete lying on back -->
      <circle cx="120" cy="148" r="10" fill="#94a3b8" />
      <!-- Torso pinned flat -->
      <line x1="130" y1="153" x2="210" y2="153" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- TRANSVERSE ABDOMINIS CORE GLOW -->
      <ellipse cx="170" cy="151" rx="24" ry="7" fill="#22c55e" filter="url(#glow)" />
      <!-- Squash grape indicator -->
      <circle cx="170" cy="158" r="4" fill="#a855f7" />
      <text x="170" y="178" fill="#a855f7" font-size="8" font-weight="bold" text-anchor="middle">🍇 SPINE FLAT</text>

      <!-- Arm 1 extending overhead / Arm 2 pointing up -->
      <line x1="140" y1="150" x2="105" y2="135" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <line x1="145" y1="150" x2="145" y2="110" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Leg 1 extending forward / Leg 2 at 90 deg -->
      <path d="M 210 153 L 265 142" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <path d="M 210 153 L 210 115 L 235 115" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">SQUASH GRAPE UNDER LOWER SPINE! Extend opposite limbs</text>
</svg>