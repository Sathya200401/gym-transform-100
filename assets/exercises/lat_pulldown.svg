<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">BACK</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#06b6d41a" stroke="#06b6d466" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#06b6d4" />
  <text x="175" y="31" fill="#06b6d4" font-size="10" font-weight="700" text-anchor="middle">LATS / V-TAPER WIDTH</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Lat Machine Frame & Top Pulley -->
      <line x1="140" y1="35" x2="260" y2="35" stroke="#334155" stroke-width="8" stroke-linecap="round" />
      <circle cx="200" cy="35" r="8" fill="#06b6d4" />
      <!-- Wide Bar angled ends -->
      <path d="M 130 50 L 200 44 L 270 50" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <!-- Cable center -->
      <line x1="200" y1="35" x2="200" y2="44" stroke="#94a3b8" stroke-width="2" />

      <!-- Seated Athlete with slight lean back -->
      <circle cx="200" cy="90" r="11" fill="#94a3b8" />
      <line x1="198" y1="102" x2="192" y2="150" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" />
      <!-- LATS GLOWING (V-Taper wings!) -->
      <path d="M 190 106 Q 170 120 186 138" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
      <path d="M 204 106 Q 224 120 208 138" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

      <!-- Thigh Pad & Legs -->
      <rect x="180" y="148" width="40" height="8" rx="2" fill="#334155" />
      <path d="M 192 150 L 220 152 L 225 185" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Arms pulling down -->
      <path d="M 190 105 L 165 85 L 145 52" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <path d="M 204 105 L 229 85 L 255 52" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

      <!-- Downward force arrows -->
      <polygon points="160,88 155,80 165,80" fill="#06b6d4" />
      <polygon points="234,88 229,80 239,80" fill="#06b6d4" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Drive elbows down to hip pockets, chest meets bar</text>
</svg>