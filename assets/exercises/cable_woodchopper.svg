<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0b1120; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Floor line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1e293b" stroke-width="2" stroke-dasharray="4" />

  <!-- Header Category & Muscle Badge -->
  <rect x="20" y="16" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CORE / AGILITY</text>

  <rect x="118" y="16" width="115" height="22" rx="6" fill="#22c55e1a" stroke="#22c55e66" stroke-width="1"/>
  <circle cx="128" cy="27" r="4" fill="#22c55e" />
  <text x="175" y="31" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">OBLIQUES & ROTATIONAL CORE</text>

  <!-- Specific Anatomical Artwork & Vector Scene -->
  
      <!-- Cable Tower at shoulder height -->
      <line x1="70" y1="40" x2="70" y2="185" stroke="#334155" stroke-width="6" />
      <circle cx="70" cy="90" r="7" fill="#06b6d4" />

      <!-- Standing Athlete rotating -->
      <circle cx="200" cy="75" r="11" fill="#94a3b8" />
      <line x1="200" y1="88" x2="205" y2="135" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" />

      <!-- Oblique side glow -->
      <path d="M 198 100 Q 212 110 202 125" stroke="#22c55e" stroke-width="6" filter="url(#glow)" />

      <!-- Pivoting feet -->
      <line x1="205" y1="135" x2="175" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="205" y1="135" x2="235" y2="185" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />

      <!-- Cable line to hands rotating across -->
      <line x1="70" y1="90" x2="235" y2="120" stroke="#64748b" stroke-width="2" stroke-dasharray="3" />
      <!-- Arms straight extended diagonally -->
      <line x1="200" y1="92" x2="245" y2="125" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <circle cx="245" cy="125" r="6" fill="#f59e0b" />

      <!-- Rotational Sweep Arc -->
      <path d="M 170 85 Q 220 70 255 120" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="3" />
      <polygon points="260,125 250,118 257,112" fill="#22c55e" />
    

  <!-- Footer Cue Box -->
  <rect x="18" y="196" width="364" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="216" fill="#f8fafc" font-size="12" font-weight="600">🎯 Form Cue:</text>
  <text x="110" y="216" fill="#cbd5e1" font-size="11">Pivot rear foot, rotate through thoracic spine and hips</text>
</svg>